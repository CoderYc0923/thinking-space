[project]
name = "fastapidemo"
version = "0.1.0"
description = ""
authors = [
    {name = "yechao",email = "1151062047@qq.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard] (>=0.142.4,<0.143.0)",
    "sqlalchemy (>=2.1.4,<3.0.0)",
    "pymysql (>=1.2.3,<2.0.0)",
    "cryptography (>=50.0.2,<51.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "redis (>=8.1.0,<9.0.0)"
]

# 应用型项目：只管理依赖，不把当前目录当可发布包安装
[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
